<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nexus globe reference prototype</title>
<style>
/* Nexus UI style (CLAUDE.md section 6): square corners, compact controls, mono data, purple as the one accent. */
:root{--bg:#0b0a12;--surface:#14121f;--surface2:#1d1a2c;--border:#3a3554;--text:#ecebf5;--muted:#9a96b8;--accent:#7F77DD;--accent-hi:#AFA9EC;--radius:0;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;}
*{border-radius:0;}
body{margin:0;background:var(--bg);color:var(--text);}
.wrap{max-width:900px;margin:0 auto;padding:8px;}
input[type=text]{flex:1;height:22px;padding:0 6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:12px var(--mono);outline:none;}
input[type=text]:focus{border-color:var(--accent);outline:1px solid var(--accent);outline-offset:-1px;}
button{height:22px;padding:0 8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:none;}
button:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
button:focus-visible{outline:1px solid var(--accent-hi);outline-offset:1px;}
.kbd{color:var(--muted);font-weight:400;margin-left:6px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:11px var(--mono);color:var(--muted);margin:6px 0;text-transform:uppercase;letter-spacing:.04em;}
.dot{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:0;}
#results{position:absolute;left:0;right:0;top:24px;z-index:5;background:var(--surface);border:1px solid var(--accent);max-height:260px;overflow:auto;visibility:hidden;}
#results [data-i]{height:20px;line-height:20px;padding:0 6px;cursor:pointer;font:11px var(--mono);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#results [data-i] > div{display:inline;}
#results [data-i] > div + div{margin-left:8px;}
#results [data-i]:hover{background:var(--accent);color:#fff;}
#results [data-i]:hover *{color:#fff !important;}
#info{background:var(--surface);border:1px solid var(--border);padding:4px 6px;font:11px var(--mono);color:var(--muted);min-height:44px;}
.mono{font-family:var(--mono);}
input[type=range]{accent-color:var(--accent);height:14px;}
</style>
</head>
<body>
<!--
  Reference implementation for CLAUDE.md section 7 (the Nexus globe).
  Vanilla Three.js r128 with fake data. The app version is a react-three-fiber component
  fed by events.query / events.subscribe / events.search, not this file.
  Mapping: one orbit per branch family, all tilted around the same axis so "now" points align;
  angle around an orbit = time (one lap = 36h); merges are arcs from source orbit to main;
  agent sessions and Slack tasks ride an outer activity ring per branch family.
-->
<div class="wrap">
  <div style="position:relative;">
    <div style="display:flex;align-items:center;gap:8px;">
      <input id="q" type="text" placeholder="Search events: slack, a1b2c3d, lane-2, approval" autocomplete="off" aria-label="Search events" />
      <button id="untrack">Untrack<span class="kbd">ESC</span></button>
    </div>
    <div id="results" role="listbox"></div>
  </div>
  <div class="legend">
    <span><span class="dot" style="border-radius:50%;background:#AFA9EC;"></span>Commit</span>
    <span><span class="dot" style="width:14px;height:2px;background:#7F77DD;vertical-align:3px;"></span>Merge arc</span>
    <span><span class="dot" style="background:#1D9E75;"></span>Agent session</span>
    <span><span class="dot" style="background:#D4537E;transform:rotate(45deg);"></span>Slack task</span>
    <span class="mono" style="margin-left:auto;color:var(--text);" id="clock">T+0h00</span>
  </div>
  <div id="stage" style="position:relative;height:520px;cursor:grab;"></div>
  <div style="display:flex;align-items:center;gap:4px;margin:6px 0;">
    <button id="pause">Pause</button>
    <button id="reset">Restart</button>
    <label style="font:11px var(--mono);color:var(--muted);text-transform:uppercase;margin-left:8px;">Speed</label>
    <input type="range" id="speed" min="0.2" max="4" step="0.1" value="1" style="flex:1;" />
  </div>
  <div id="info">Search above or click an event to track it. Drag to rotate freely.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const el=document.getElementById('stage');const W=el.clientWidth,H=520;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(window.devicePixelRatio);renderer.setSize(W,H);el.appendChild(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,W/H,0.1,100);camera.position.set(0,0.8,8.2);camera.lookAt(0,0,0);
const world=new THREE.Group();scene.add(world);const globe=new THREE.Group();world.add(globe);
function ringPts(r,y,seg){const p=[];for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2;p.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));}return p;}
function line(pts,mat){return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);}

// Planet: latitude rings + meridians; an invisible depth-only sphere hides lines behind it.
const R=1.45;const gMat=new THREE.LineBasicMaterial({color:0x7F77DD});
[-60,-30,0,30,60].forEach(d=>{const t=d*Math.PI/180;globe.add(line(ringPts(R*Math.cos(t),R*Math.sin(t),96),gMat));});
for(let k=0;k<6;k++){const m=line(ringPts(R,0,96),gMat);m.rotation.set(Math.PI/2,0,k*Math.PI/6);globe.add(m);}
globe.add(new THREE.Mesh(new THREE.SphereGeometry(R*0.99,48,48),new THREE.MeshBasicMaterial({colorWrite:false})));

// Orbits: tilt around Z only, so every orbit's angle-PI/2 point lies on the +Z "now" ray.
const HOURS=36;
const defs=[{id:'main',r:2.0,tilt:0},{id:'lane-1',r:2.4,tilt:0.55},{id:'lane-2',r:2.4,tilt:-0.55},{id:'lane-3',r:2.85,tilt:1.0}];
const orbits={};const oMat=new THREE.LineBasicMaterial({color:0x7F77DD,transparent:true,opacity:0.55});const aMat=new THREE.LineBasicMaterial({color:0xAFA9EC,transparent:true,opacity:0.22});
defs.forEach(d=>{const g=new THREE.Group();g.rotation.z=d.tilt;world.add(g);g.add(line(ringPts(d.r,0,160),oMat));if(d.id!=='main')g.add(line(ringPts(d.r+0.28,0,160),aMat));g.updateMatrix();orbits[d.id]={g,r:d.r};});
world.add(line([new THREE.Vector3(0,0,R),new THREE.Vector3(0,0,3.6)],new THREE.LineBasicMaterial({color:0xCECBF6})));

// Fake event data (deterministic).
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const commitMsgs={'lane-1':['add provider interface','stream agent events over ipc','add approval tool to runtime','list models from anthropic key','thread-to-task brief builder'],'lane-2':['wrap slack events as Message[]','index git log into event store','add code ref resolver','encrypt key with safeStorage','add git merge and branch ops'],'lane-3':['scaffold renderer shell','render code ref chip','add git history view','add chat panel','orbit time mapping on globe']};
const agentMsgs=['session: build thread-to-task brief','session: fix chat scroll','session: add diff panel','session: wire approval prompt'];
const slackMsgs=['#nexus: "can an agent take the login bug?"','#nexus: approved agent change','#nexus: code ref to globe.tsx','#nexus: checkpoint 2 is green'];
const events=[];const pick=[];
const geos={commit:new THREE.SphereGeometry(0.05,14,14),merge:new THREE.OctahedronGeometry(0.08),agent:new THREE.BoxGeometry(0.1,0.1,0.1),slack:new THREE.OctahedronGeometry(0.075,0)};
const mats={commit:new THREE.MeshBasicMaterial({color:0xAFA9EC}),merge:new THREE.MeshBasicMaterial({color:0x7F77DD}),agent:new THREE.MeshBasicMaterial({color:0x1D9E75}),slack:new THREE.MeshBasicMaterial({color:0xD4537E})};
function addEvent(kind,orbit,t,msg,ring){const m=new THREE.Mesh(geos[kind],mats[kind]);m.visible=false;world.add(m);const sha=Math.floor(rnd()*0xfffffff).toString(16).padStart(7,'0');const e={kind,orbit,t,msg,ring,mesh:m,sha};m.userData=e;events.push(e);pick.push(m);return e;}
['lane-1','lane-2','lane-3'].forEach(L=>{let t=0.4+rnd()*0.6;while(t<HOURS-0.3){addEvent('commit',L,t,commitMsgs[L][Math.floor(rnd()*5)],0);t+=0.5+rnd()*1.3;}
let a=1+rnd()*2;while(a<HOURS-0.5){addEvent(rnd()<0.55?'agent':'slack',L,a,'',1);a+=1.6+rnd()*2.5;}
let mt=3+rnd()*2;while(mt<HOURS-0.5){const e=addEvent('merge','main',mt,'merge '+L+' into main',0);e.from=L;mt+=3+rnd()*3;}});
events.forEach(e=>{if(e.kind==='agent')e.msg=agentMsgs[Math.floor(rnd()*4)];if(e.kind==='slack')e.msg=slackMsgs[Math.floor(rnd()*4)];});
const arcMat=new THREE.LineBasicMaterial({color:0x7F77DD,transparent:true,opacity:0.85});
events.filter(e=>e.kind==='merge').forEach(e=>{const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(25*3),3));const ln=new THREE.Line(geo,arcMat);ln.visible=false;world.add(ln);e.arc=ln;});

// Angle = time: newest at the now ray (angle PI/2), one lap = HOURS.
const tmp=new THREE.Vector3();
function posAt(orbit,ring,t,now,out){const o=orbits[orbit];const r=o.r+(ring?0.28:0);const a=Math.PI/2+(now-t)/HOURS*Math.PI*2;out.set(Math.cos(a)*r,0,Math.sin(a)*r).applyMatrix4(o.g.matrix);return out;}
const A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3();
function layout(now){events.forEach(e=>{const vis=e.t<=now;e.mesh.visible=vis;if(e.arc)e.arc.visible=vis;if(!vis)return;posAt(e.orbit,e.ring,e.t,now,e.mesh.position);
if(e.arc){posAt(e.from,0,e.t,now,A);B.copy(e.mesh.position);C.addVectors(A,B).multiplyScalar(0.5);C.setLength(Math.max(A.length(),B.length())+0.55);const curve=new THREE.QuadraticBezierCurve3(A,C,B);const p=e.arc.geometry.attributes.position;for(let i=0;i<25;i++){curve.getPoint(i/24,tmp);p.setXYZ(i,tmp.x,tmp.y,tmp.z);}p.needsUpdate=true;e.arc.geometry.computeBoundingSphere();}});}

const tracker=new THREE.Mesh(new THREE.RingGeometry(0.16,0.19,40),new THREE.MeshBasicMaterial({color:0xCECBF6,side:THREE.DoubleSide,transparent:true,opacity:0.9}));tracker.visible=false;scene.add(tracker);
let now=0,paused=false,speed=1,drag=false,lx=0,ly=0,rotY=-0.7,rotX=0.22,moved=0,sel=null,tracking=null;
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};
document.getElementById('reset').onclick=()=>{now=0;stopTrack();};
document.getElementById('speed').oninput=e=>{speed=parseFloat(e.target.value);};
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;el.style.cursor='grabbing';});
window.addEventListener('pointerup',e=>{if(drag&&moved<4)choose(e);drag=false;el.style.cursor='grab';});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);if(moved>4&&tracking)stopTrack();rotY+=dx*0.006;rotX=Math.max(-1.2,Math.min(1.2,rotX+dy*0.006));lx=e.clientX;ly=e.clientY;});
const ray=new THREE.Raycaster();ray.params.Line={threshold:0.06};const mv=new THREE.Vector2();
const lab={commit:'Commit',merge:'Merge',agent:'Agent session',slack:'Slack task'};
const fmt=h=>'T+'+Math.floor(h)+'h'+String(Math.floor((h%1)*60)).padStart(2,'0');
const where=d=>d.kind==='merge'?d.from+' → main':d.orbit+(d.ring?' activity ring':'');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function select(d){if(sel)sel.mesh.scale.setScalar(1);sel=d;tracking=d;tracker.visible=true;
const dest=d.kind==='agent'?'agent session view':d.kind==='slack'?'Slack thread in the chat panel':'git view at '+d.sha;
document.getElementById('info').innerHTML='<div style="color:var(--text);font-weight:500;margin-bottom:4px;">Tracking · '+lab[d.kind]+' · '+where(d)+' · '+fmt(d.t)+'</div><div class="mono" style="font-size:13px;color:var(--text);">'+(d.kind==='commit'||d.kind==='merge'?d.sha+'  ':'')+esc(d.msg)+'</div><div style="font-size:13px;margin-top:4px;">In Nexus this opens the '+dest+'.</div>';}
function stopTrack(){tracking=null;tracker.visible=false;if(sel)sel.mesh.scale.setScalar(1);}
document.getElementById('untrack').onclick=stopTrack;
function choose(e){const r=cv.getBoundingClientRect();mv.x=((e.clientX-r.left)/r.width)*2-1;mv.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mv,camera);
const targets=pick.filter(m=>m.visible).concat(events.filter(x=>x.arc&&x.arc.visible).map(x=>x.arc));const hits=ray.intersectObjects(targets);if(!hits.length)return;
const o=hits[0].object;select(o.userData&&o.userData.kind?o.userData:events.find(x=>x.arc===o));}

// Search: in the app this calls events.search over the whole store, not visible meshes.
const q=document.getElementById('q'),res=document.getElementById('results');let shown=[];
function search(){const s=q.value.trim().toLowerCase();if(!s){res.style.visibility='hidden';return;}
shown=events.filter(e=>e.t<=now&&(e.msg+' '+e.sha+' '+where(e)+' '+lab[e.kind]).toLowerCase().includes(s)).sort((a,b)=>b.t-a.t).slice(0,8);
res.innerHTML=shown.length?shown.map((e,i)=>'<div role="option" data-i="'+i+'"><div style="color:var(--text);">'+esc(e.msg)+'</div><div style="color:var(--muted);font-size:12px;">'+lab[e.kind]+' · '+where(e)+' · '+fmt(e.t)+(e.kind==='commit'||e.kind==='merge'?' · '+e.sha:'')+'</div></div>').join(''):'<div style="padding:8px 12px;font-size:13px;color:var(--muted);">No events match yet.</div>';
res.style.visibility='visible';}
q.addEventListener('input',search);q.addEventListener('focus',search);
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&shown.length){select(shown[0]);res.style.visibility='hidden';}if(e.key==='Escape'){res.style.visibility='hidden';q.blur();}});
res.addEventListener('mousedown',e=>{const row=e.target.closest('[data-i]');if(!row)return;e.preventDefault();select(shown[+row.dataset.i]);res.style.visibility='hidden';});
document.addEventListener('mousedown',e=>{if(!res.contains(e.target)&&e.target!==q)res.style.visibility='hidden';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement!==q)stopTrack();});

// Tracking: rotate world so the event faces the camera (yaw then pitch), zoom in, ring it.
function wrap(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
const clock=document.getElementById('clock');let last=performance.now();const wp=new THREE.Vector3();
function tick(t){const dt=Math.min(0.05,(t-last)/1000);last=t;if(!paused){now=Math.min(HOURS,now+dt*0.9*speed);if(!drag&&!tracking)rotY+=dt*0.03;globe.rotation.y+=dt*0.05;}
layout(now);
if(tracking&&tracking.mesh.visible){const p=tracking.mesh.position;const ty=Math.atan2(-p.x,p.z);const zr=-p.x*Math.sin(ty)+p.z*Math.cos(ty);const tx=Math.max(-1.2,Math.min(1.2,Math.atan2(p.y,zr)));
rotY+=wrap(ty-rotY)*Math.min(1,dt*3);rotX+=(tx-rotX)*Math.min(1,dt*3);camera.position.z+=(6.4-camera.position.z)*Math.min(1,dt*2);
tracking.mesh.scale.setScalar(1.5+0.4*Math.sin(t/200));}else camera.position.z+=(8.2-camera.position.z)*Math.min(1,dt*2);
world.rotation.set(rotX,rotY,0);world.updateMatrixWorld();
if(tracking){tracking.mesh.getWorldPosition(wp);tracker.position.copy(wp);tracker.lookAt(camera.position);}
clock.textContent=fmt(now)+' / T+36h';renderer.render(scene,camera);requestAnimationFrame(tick);}
requestAnimationFrame(tick);
</script>
</body>
</html>
